[project]
name = "hacktoberfest-jev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.5",
    "langchain-google-genai==4.4.1",
    "pydantic==2.14.1",
    "pydantic-ai==2.55.0",
    "typesafe-sdk==0.7.4",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
